<!--
  Source for images/og-cover.jpg (the Open Graph / Twitter card, 1200x630).
  Not deployed: the Cloudflare Pages workflow copies only the public files.

  Re-render after editing, from this folder:
    python3 -m http.server 8000
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --hide-scrollbars --window-size=1200,630 \
      --virtual-time-budget=8000 --screenshot=/tmp/og.png \
      http://localhost:8000/og-cover.source.html
    sips -s format jpeg -s formatOptions 86 /tmp/og.png --out images/og-cover.jpg

  Served over HTTP, not opened as a file, so the avatar and Inter both load.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#00d4aa; --accent-alt:#6366f1; --bg:#070b14; --text-dim:#aab6c2; --text-muted:#8b9ab0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff;position:relative}

  /* Same glow language as the site background, scaled to the card. */
  .glow-a{position:absolute;width:760px;height:760px;top:-300px;right:-220px;
    background:radial-gradient(circle, rgba(0,212,170,0.14) 0%, transparent 68%)}
  .glow-b{position:absolute;width:640px;height:640px;bottom:-300px;left:-200px;
    background:radial-gradient(circle, rgba(99,102,241,0.16) 0%, transparent 70%)}
  .dots{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,0.20) 1px, transparent 1.2px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse at 30% 40%, #000 0%, transparent 78%)}
  .grid-line{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,212,170,.35),transparent)}

  .frame{position:absolute;inset:0;padding:66px 72px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;font-size:26px;letter-spacing:2px;
    background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .eyebrow{color:var(--accent);font-size:14px;font-weight:600;letter-spacing:4px}

  .body{display:flex;align-items:center;gap:56px}
  .copy{flex:1}
  h1{font-size:82px;font-weight:800;letter-spacing:-2.5px;line-height:1.02}
  .grad{background:linear-gradient(135deg,var(--accent) 0%,#818cf8 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .role{margin-top:16px;font-size:29px;font-weight:600;color:#e8eef6;letter-spacing:-.4px}
  .pillars{margin-top:14px;font-size:19px;font-weight:500;color:var(--text-muted);letter-spacing:.6px}

  .chips{margin-top:34px;display:flex;gap:12px}
  .chip{font-size:15px;font-weight:600;letter-spacing:.3px;color:var(--accent);
    padding:9px 18px;border-radius:999px;background:rgba(0,212,170,0.08);border:1px solid rgba(0,212,170,0.28)}
  .chip.alt{color:#a5b4fc;background:rgba(99,102,241,0.10);border-color:rgba(99,102,241,0.30)}

  .avatar-wrap{position:relative;flex:0 0 auto}
  .avatar-ring{position:absolute;inset:-18px;border-radius:50%;
    background:conic-gradient(from 140deg, rgba(0,212,170,.85), rgba(99,102,241,.75), rgba(0,212,170,.15), rgba(0,212,170,.85));
    filter:blur(1px);opacity:.55}
  .avatar-clip{position:relative;width:268px;height:268px;border-radius:50%;overflow:hidden;
    border:3px solid rgba(255,255,255,0.14);box-shadow:0 26px 70px rgba(0,0,0,.55), 0 0 0 12px rgba(0,212,170,.06)}
  .avatar{width:100%;height:100%;object-fit:cover;object-position:66% 42%;transform:scale(1.26);transform-origin:66% 42%}

  .bottom{display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(255,255,255,0.08);padding-top:22px}
  .foot{font-size:17px;color:var(--text-dim);font-weight:500}
  .foot b{color:#fff;font-weight:700}
  .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 12px 3px}
</style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="dots"></div>
  <div class="grid-line" style="top:0"></div>

  <div class="frame">
    <div class="top">
      <div class="logo">DZ</div>
      <div class="eyebrow">LOS ANGELES, CA</div>
    </div>

    <div class="body">
      <div class="copy">
        <h1>Darryl Zorrilla</h1>
        <p class="role">Senior <span class="grad">Full-Stack &amp; Mobile</span> Engineer</p>
        <p class="pillars">Mobile · API · Cloud · AI · Real-Time</p>
        <div class="chips">
          <span class="chip">15+ Years Shipping</span>
          <span class="chip">15+ Apps in Production</span>
          <span class="chip alt">Concept → App Store</span>
        </div>
      </div>
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar-clip"><img class="avatar" src="images/djzorrilla.webp" alt=""></div>
      </div>
    </div>

    <div class="bottom">
      <div class="foot"><b>iOS</b> · React Native · TypeScript · NestJS · AWS · Gemini</div>
      <div class="foot">Open to <b>senior</b> &amp; <b>founding engineer</b> roles</div>
    </div>
  </div>
</body>
</html>
